<h2>Comments on {{ kind }} {{ iid }}</h2>
<ul class="thread">
{% for c in thread %}
  <li><strong>{{ c.author or 'owner' }}</strong> <span class="muted">{{ c.at }}</span>
    {% if c.urgent %}<span class="pill bad">urgent</span>{% endif %}{% if c.replan %}<span class="pill warn">replan</span>{% endif %}
    <p>{{ c.body }}</p></li>
{% else %}<li class="muted">No comments yet.</li>{% endfor %}
</ul>
<form method="post" action="/items/{{ kind }}/{{ iid }}/comments" hx-post="/items/{{ kind }}/{{ iid }}/comments" hx-target="#sheet-body" hx-swap="innerHTML">
  <label for="cbody">New comment</label>
  <textarea id="cbody" name="body" rows="3" data-draft required></textarea>
  <label class="check"><input type="checkbox" name="urgent"> Urgent</label>
  <label class="check"><input type="checkbox" name="replan"> Replan</label>
  <button class="btn ok">Send</button>
</form>
