# drover.example.toml: configuration keys and recommended account seats.
#
# Copy to %USERPROFILE%\.drover\config.toml (or run `python -m drover init`, which writes one for your machine).
# Omitted keys use built-in defaults; the seats below demonstrate the recommended account setup.
# Machine layers, lowest first: built-in defaults, <home>/config.toml, then recognized DROVER_* variables.
# DROVER_HOME names the folder holding config.toml (default ~/.drover). There is no application overlay.
# Environment overrides use DROVER_<SECTION>_<KEY>, for example
# DROVER_HUB_UI_PORT=9000, DROVER_PATHS_STATE_DIR=D:\drover, DROVER_DECIDER_DEVICE=cpu; lists are comma-separated.
# Older names still work: DROVER_OLLAMA_URL, DROVER_REPOS_DIR, DROVER_WSL_USER, DROVER_WSL_DISTRO.
# Check a file with: python -m drover config --check FILE      Show the effective values: python -m drover config --show
#
# Where config and the tuner both own a value (parallel_cap, tau, landing_batch_size), config is only the starting
# value: a value the tuner or the ledger has set wins.

# Where the per-repository repos/*.toml live. Empty = <state_dir>\repos. While that folder does not exist the
# examples shipped in the repository's repos/ folder require DROVER_EXAMPLES=1. A legacy programs/ folder
# is read with a warning only when repos/ is missing. DROVER_REPO_CONFIGS_DIR overrides this key.
repos_dir = ""

# Repo configuration has two layers: the target repo's .drover/config.toml at the selected commit,
# then <state>/repos/<name>.toml with machine facts. One loader merges and validates both.
# After adoption all machine policy is rejected; absent entries retain complete machine fallback.
# A repo registration names the repo, worktrees, default branch and remote; it may set [run.env]
# for machine tool paths. Commit repo rules and action scripts with the code they describe.
#
# Example versioned .drover/config.toml:
# schema_version = 1
# [scripts]
# test = ".drover/scripts/test.ps1"
# docs = ".drover/scripts/docs.ps1"  # optional action for documentation-only changes
# [run]
# platforms = ["windows", "wsl"]
# default = "wsl"
# sandbox_writable_roots = ["/tmp/acme-cache"]
# [run.env]
# WORK_CACHE = "/tmp/acme-cache"
# [gate]
# platform = "both"          # windows, then wsl; both must pass
# timeout_s = 3600
# idle_s = 1200
#
# Every action runs verbatim as:
# pwsh -NoLogo -NoProfile -NonInteractive -File <script>
# Its cwd is the worktree. PowerShell 7 and the repo's tools must be installed on each side.
# A result is the exit code plus the output tail. Repo scripts own tool setup and test scope.
# DROVER_CHANGED_FILES is a JSON array of changed paths; DROVER_CI_KIND is checks, full or docs.
# [run.env] adds environment entries to workers and checks. The runner pre-creates each
# sandbox_writable_roots entry with mode 0777; only paths below /tmp are accepted.
# A repo without scripts.test has an unknown check and needs owner configuration.
#
# Docs-only diffs use `git diff --check` and optional scripts.docs. Any non-documentation
# path means the test action. gate.docs_only = false or empty docs_only_globs disables this.
# Default docs_only_globs = ["docs/**", "*.md", "GLOSSARY.md", "LICENSE", "!.github/**"].
# Globs without a slash match a file name anywhere; ! excludes. Linked files run the test action.
#
# Simultaneous checks are owner settings gate_slots (default 5, 1..32) and gate_reserved
# (default 1, 0..slots-1; reserved slots serve P0-P2). Changes apply on the next tick.

[paths]
# The state dir holds ledger.db, runs\, rescue\, hub-token, dispatcher.lock, config.toml and repos\, under an
# owner-only ACL. Empty = the folder holding config.toml: %USERPROFILE%\.drover.
state_dir = ""
# Bare repo names (the website's import) resolve under this folder.
repos_root = "~/repos"
# Empty = a <repo>.worktrees folder next to each repo (a repo's own `worktrees` key wins); or one shared root.
worktrees = ""
# The WSL distro that serves as the worker pool.
wsl_distro = "Ubuntu"
# The user inside that distro. Empty = your Windows user name.
wsl_user = ""

# Seats identify accounts by their config directory. The example uses the owner-settled order;
# omitted [[seats]] retains the legacy two-seat defaults. Lists replace the defaults as a whole.
# A zero max_workers leaves only the global parallel_cap. Codex runs in WSL (ADR 0002).
[[seats]]
name = "codex"
backend = "codex"
priority = 1
max_workers = 0
reserve_pct = 10.0           # seven_day floor
five_hour_base_pct = 5.0     # five_hour floor = base + per_hour x hours until that window resets
five_hour_per_hour_pct = 5.0 # (5% at reset, 30% with 5 hours left; unknown reset counts as 5 hours)
director = false
director_reserve_pct = 0.0
placement = "wsl"
binary = "codex"
sandbox = "workspace-write"
codex_home = "~/.codex"      # CODEX_HOME; config_dir remains a compatible alias
config_dir = ""

[[seats]]
name = "claude"
backend = "claude"
priority = 2
max_workers = 0
reserve_pct = 25.0           # workers leave 25%; director work may use it
director = true
director_reserve_pct = 0.0   # legacy extra backend reserve; measured routing uses reserve_pct
placement = "windows"
binary = "claude"
config_dir = "~/.claude"    # CLAUDE_CONFIG_DIR

[[seats]]
name = "claude-personal"
backend = "claude"
priority = 3
max_workers = 0
reserve_pct = 10.0
director = false
director_reserve_pct = 0.0
placement = "windows"
binary = "claude"
config_dir = "~/.claude-personal"

[seats_policy]
waste_threshold_pct = 15.0 # projected unused weekly percentage points at reset; urgent seats move first

[director]
seat = "claude"            # empty selects the seat flagged director
model = "opus-5.5"         # empty uses models.director
effort = "high"

[models]
review = "sonnet-5.5"       # the reviewer model
director = "opus-5.5"       # the director and planner model; it must be on the claude ladder

[models.ids]                # the name used in Drover -> the id passed to the CLI (unlisted names pass through)
"haiku-5.5" = "claude-haiku-5-5"
"sonnet-5.5" = "claude-sonnet-5-5"
"opus-5.5" = "claude-opus-5-5"

[models.efforts]            # reasoning effort by tier: the first rung of a ladder is "cheap", the last is "top"
cheap = "xhigh"             # cheap models (Haiku, Luna) always run at this effort
mid = "high"
top = "high"
small_claude = "max"        # the router's effort for a small task when its model is not on a cheap rung
small_codex = "xhigh"

[models.ladders]            # cheapest first; a task escalates one rung after every second failure
claude = ["haiku-5.5", "sonnet-5.5", "opus-5.5"]
codex = ["gpt-6-luna", "gpt-6.1-sol"]

[models.start]              # the rung a task of each size starts on (0 = cheapest)
S = 0
M = 1
L = 1

[capacity]
parallel_cap = 4            # workers at once, all seats; the tuner may move it by one either way

# Trackers: resource checks before new work starts. queue = start nothing new, hold = stop everything. A [[trackers]]
# entry with the name of a built-in one overrides just the keys you give; a new name adds a tracker; enabled = false
# switches one off. Unknown facts never block. Legacy resources.toml is ignored; migrate its thresholds
# into named trackers. See docs/configuration.md and `python -m drover config explain trackers`.
[[trackers]]
kind = "load"               # 5-minute load average per core
name = "load"
queue_per_core = 2.5
hold_per_core = 3.5

[[trackers]]
kind = "ram"                # MemAvailable on WSL, available physical memory on Windows
name = "ram"
queue_base_gb = 6.0         # queue below this, plus resident Ollama RAM (Windows)...
queue_per_worker_gb = 0.5   # ...plus this per new worker
hold_gb = 4.0

[[trackers]]
kind = "disk"
name = "h"
path = "~/repos"                # where to measure
wsl_source = "vhdx"         # on WSL: path (measure `path`), vhdx (the drive holding the distro's ext4.vhdx), home (WSL's ext4)
queue_gb = 75.0
hold_gb = 25.0

[[trackers]]
kind = "disk"
name = "wsl"
path = ""
wsl_source = "home"         # WSL's own ext4; unknown (never blocks) when the hub runs on Windows
queue_gb = 75.0
hold_gb = 25.0

[[trackers]]
kind = "disk"
name = "c"
path = 'C:\'
wsl_source = "path"
queue_gb = 50.0
hold_gb = 25.0

[[trackers]]
kind = "vram"               # GPU memory in use, percent
name = "vram"
fallback_pct = 80.0         # above this the decider falls back (see [decider] device)
queue_pct = 0.0             # 0 = never queues on VRAM
hold_pct = 0.0

[[trackers]]
kind = "wsl"                # is the distro up, and its memory against the .wslconfig cap
name = "wsl-up"             # blocks only work that needs WSL (WSL workers and WSL gates), never Windows work
distro = ""                 # empty = paths.wsl_distro
queue_mem_pct = 0.0         # queue WSL work above this % of the cap (0 = off)
hold_mem_pct = 0.0

[policy]
tau = 0.8                   # the decider's starting confidence threshold; the tuner moves it
landing_batch_size = 3      # 1..5, the starting landing batch size; the tuner moves it
tuner_cadence_days = [1, 1, 2, 3, 5, 7]   # days between tuning passes by step, then the last value forever
push = false                # legacy setting; repos default to [landing] push = false

[decider]
commercial_use = false      # choose model licences that permit your intended use
url = ""                    # empty = find Ollama (DROVER_OLLAMA_URL, else the Windows host from WSL, else localhost:11434)
device = "gpu"              # auto | gpu | cpu. Both placements use /v1/systemone, without options.
                            # cpu selects <name>-cpu; auto selects it while VRAM > the vram tracker's fallback_pct.
                            # Create missing CPU variants first: python -m drover.decide ensure-cpu-models
                            # (init also does this for cpu/auto). Variants inherit the model with num_gpu=0.
mode = "shadow"             # shadow | live: the default for questions that do not set their own
timeout_s = 5.0
ollama_models = ""          # informational: where you keep the models (OLLAMA_MODELS); `init` prints the setx for it

[decider.models]
primary = "nimble-v3"
shadow = "nimble"           # runs alongside the primary in shadow mode
long_state = "nimble"       # used when the state is over 32K tokens

[hub]
ui_port = 8765
api_port = 8766             # the WSL-facing API; off unless api_listen_wsl is true
tailscale = true            # false: no tailscale lookups, the UI answers loopback only
allowed_logins = []         # Tailscale logins allowed to use the UI; empty = this machine's owner
api_listen_wsl = false

[hub.auth]
mode = "tailscale"          # the only mode today
# Reserved for Google OIDC SSO on larger networks; accepted and ignored for now.
issuer = ""
client_id = ""
allowed_emails = []

[config_sync]
remote = ""                  # optional private git remote URL; it MUST be private
auto_push = true             # push after local configuration/decision commits; failure is nonfatal
